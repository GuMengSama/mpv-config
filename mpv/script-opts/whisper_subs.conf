# Spoken language (zh, ja, en, ...); auto detects it from the first chunk
language=auto

# Skip silence (stops invented lines there); set to no for songs
vad=yes

# Initial prompt, e.g. 以下是普通话的句子。 to get Simplified Chinese
prompt=

# Chunk lengths in seconds; the first chunk at the playhead is short
first_chunk=20
chunk=60

# How far ahead of the playhead to transcribe, in seconds
lookahead=180
