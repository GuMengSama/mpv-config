# uosc replaces the built-in on-screen controller
osc=no
osd-bar=no

# Resume playback where it was left off
save-position-on-quit=yes

# Sign in to sites as the Chrome user (avoids YouTube's bot check, unlocks
# login-only qualities). From the ff2mpv button this needs Full Disk Access for
# ~/.local/bin/ff2mpv-rust, which macOS drops when it is rebuilt
ytdl-raw-options-append=cookies-from-browser=chrome

# Settings for YouTube only, so other sites are unaffected when they fail
[youtube]
profile-cond=(path or ""):find("youtube%.com/") or (path or ""):find("youtu%.be/")
profile-restore=copy
# YouTube refuses many streams without a PO token. The mweb client sends one,
# generated by bgutil-ytdlp-pot-provider. Both it and YouTube's JS challenge
# need node, given by full path because mpv started from Chrome has no Homebrew
# PATH (only one js-runtimes value is kept)
ytdl-raw-options-append=js-runtimes=node:/opt/homebrew/bin/node
ytdl-raw-options-append=extractor-args=youtube:player_client=mweb
# YouTube throttles single large range requests and sometimes refuses the
# first request to a new stream URL, so fetch in 10 MB pieces and retry 403s
stream-lavf-o-append=request_size=10485760
stream-lavf-o-append=reconnect_on_http_error=403
stream-lavf-o-append=reconnect_max_retries=5
stream-lavf-o-append=reconnect_delay_max=2
